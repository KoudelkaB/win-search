name: logexplorer

# Log explorer (logexplorer/, Rust). Its unit, engine regression and headless UI tests
# run on both systems; the smoke tests drive the built program with real keys and the
# clipboard - on Linux on an X server of its own, on Windows on the runner's desktop.
# Not on a push to main: the release workflow calls it beside the build of the packages
# (nothing is published unless it passes), a pull request that touches the program runs it,
# and it can be started by hand.
on:
  pull_request:
    paths:
      - 'logexplorer/**'
      - '.github/workflows/logexplorer.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: logexplorer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: logexplorer

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The runner images carry rustup; the stable toolchain with the two tools the checks use
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - name: Format and lints
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit, engine regression and headless UI tests
        run: cargo test --workspace

  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # The X server and the tools that drive it, and Mesa's software renderers for the window
      - name: X server tools
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool xclip openbox libxkbcommon-x11-0 libxcursor1 libxi6 libegl1 libgl1-mesa-dri mesa-vulkan-drivers

      # Every test starts an X server of its own, so they run side by side.
      # CI=true turns "could not run" from a skip into a failure.
      - name: Smoke tests
        env:
          CI: 'true'
        run: cargo test -p logexplorer --test smoke -- --ignored

  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # One window at a time: they share the desktop, the keyboard and the clipboard
      - name: Smoke tests
        env:
          CI: 'true'
        run: cargo test -p logexplorer --test smoke -- --ignored --test-threads=1
