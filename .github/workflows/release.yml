name: release

# Pushing a tag like v0.1.0 builds the installer and publishes a GitHub release.
# The tag is the single source of truth for the version: MinVer stamps it into
# the assemblies and the same tag names the installer artifact.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tag history
          submodules: true

      # The H (Hex editor) and L (Log explorer) pages ship inside the installer. Release with
      # the latest upstream apps rather than the commit pinned in this repository - but never
      # with an older one: the app relies on what the pinned commit provides (the Log explorer
      # embedding API for full paths, the load mode and the Show in files filter), so an
      # upstream branch that does not contain it yet fails the release instead of shipping
      # pages that silently ignore those options.
      - name: Update web apps to latest singleHtmlApps
        shell: pwsh
        run: |
          $pinned = (git ls-tree HEAD external/singleHtmlApps).Split()[2]
          if ((git -C external/singleHtmlApps rev-parse --is-shallow-repository) -eq 'true') {
            git -C external/singleHtmlApps fetch --unshallow origin
          }
          git submodule update --init --remote external/singleHtmlApps
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C external/singleHtmlApps log -1 --format="Using singleHtmlApps %H (%cs) %s"
          git -C external/singleHtmlApps merge-base --is-ancestor $pinned HEAD
          if ($LASTEXITCODE) {
            Write-Error "singleHtmlApps upstream does not contain the pinned commit $pinned - merge it upstream before releasing"
            exit 1
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish app and service and build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          .\tools\Build-Installer.ps1 -Version $env:VERSION -IsccPath $iscc

      - name: Generate checksum
        shell: pwsh
        run: |
          $file = "installer/Output/FileSearchManager-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToUpperInvariant()
          "$hash  FileSearchManager-Setup-$env:VERSION.exe" | Set-Content installer/Output/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer/Output/FileSearchManager-Setup-${{ env.VERSION }}.exe
            installer/Output/SHA256SUMS.txt
          generate_release_notes: true
          # v1.2.3-rc1 style tags must never become "Latest" - the site and README link there
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Opens the manifest-update PR against microsoft/winget-pkgs. This only works once the
  # package already exists there - the very first version has to be submitted by hand
  # (see docs/WINGET.md). WINGET_TOKEN is required; fail clearly when it is missing so a
  # successful release cannot be mistaken for a successful WinGet submission.
  winget:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases like v0.2.0-rc1
    steps:
      - name: Verify WinGet credentials
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -z "$WINGET_TOKEN" ]]; then
            echo "::error title=Missing WINGET_TOKEN::Add a classic GitHub PAT with public_repo and workflow scopes as the WINGET_TOKEN repository secret."
            exit 1
          fi

      - name: Submit manifest to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: BohdanKoudelka.FileSearchManager
          installers-regex: '^FileSearchManager-Setup-.*\.exe$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}
