name: smoke

# The smoke tests over the published build (search.smoke): the app runs as its own process
# with a data folder of its own and is driven from outside - UI Automation on Windows, the
# X server (Xvfb, xdotool, xclip) on Linux. Started by hand, or called by another workflow
# before it releases.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tag history
          submodules: true # the web apps (H, L, the calculator) ship from it

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The runner is an administrator: the app reads C:'s $MFT itself, no service needed.
      # CI=true turns "could not get the foreground" from a skip into a failure.
      - name: Smoke tests
        shell: pwsh
        env:
          CI: 'true'
        run: dotnet test search.smoke -c Release --logger "console;verbosity=normal"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: X server tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool xclip wmctrl openbox

      # A small file system of its own for the files the tests create: the app indexes only
      # that mount, so the load takes a moment instead of walking the whole runner image
      - name: Work file system
        run: |
          truncate -s 64M "$RUNNER_TEMP/smoke.img"
          mkfs.ext4 -q "$RUNNER_TEMP/smoke.img"
          sudo mkdir -p /mnt/smoke
          sudo mount -o loop "$RUNNER_TEMP/smoke.img" /mnt/smoke
          sudo chown "$(id -u):$(id -g)" /mnt/smoke

      - name: Smoke tests
        env:
          CI: 'true'
          WIN_SEARCH_SMOKE_WORK: /mnt/smoke
        run: xvfb-run -a -s "-screen 0 1600x1000x24" sh -c 'openbox & sleep 1; dotnet test search.smoke -c Release --logger "console;verbosity=normal"'
