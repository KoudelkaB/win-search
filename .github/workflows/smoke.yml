name: smoke

# The smoke tests over the published build (search.smoke): the app runs as its own process
# with a data folder of its own and is driven from outside - UI Automation on Windows, the
# X server (Xvfb, xdotool, xclip) on Linux. Started by hand, the tests publish the app from
# this commit, with Log explorer (logexplorer/) built first; called by the release workflow,
# they test the very build it releases (its web apps come from the latest singleHtmlApps,
# not the pinned commit).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      windows-app:
        description: An artifact of the calling run holding the published Windows app folder (FileSearchManager.exe at its top)
        type: string
        default: ''
      linux-app:
        description: An artifact of the calling run holding the portable FileSearchManager-*-linux-x64.tar.gz
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tag history
          submodules: true # the web apps (H, the calculator) ship from it

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Started by hand the tests publish the app themselves: Log explorer goes with it
      - name: Build Log explorer
        if: inputs.windows-app == ''
        shell: pwsh
        working-directory: logexplorer
        run: rustup toolchain install stable --profile minimal; rustup default stable; cargo build --release --locked -p logexplorer

      - name: The build to release
        if: inputs.windows-app != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.windows-app }}
          path: ${{ runner.temp }}/app

      - name: Test that build
        if: inputs.windows-app != ''
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'app\FileSearchManager.exe'
          if (-not (Test-Path $exe)) { Write-Error "The artifact ${{ inputs.windows-app }} has no FileSearchManager.exe"; exit 1 }
          "WIN_SEARCH_APP=$exe" >> $env:GITHUB_ENV

      # The runner is an administrator: the app reads C:'s $MFT itself, no service needed.
      # CI=true turns "could not get the foreground" from a skip into a failure.
      - name: Smoke tests
        shell: pwsh
        env:
          CI: 'true'
        run: dotnet test search.smoke -c Release --logger "console;verbosity=normal" --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-results-Windows
          path: TestResults/*.trx
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Mesa's software renderers draw the window of Log explorer
      - name: X server tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool xclip wmctrl openbox x11-apps libxkbcommon-x11-0 libxcursor1 libxi6 libegl1 libgl1-mesa-dri mesa-vulkan-drivers

      # Started by hand the tests publish the app themselves: Log explorer goes with it
      - name: Build Log explorer
        if: inputs.linux-app == ''
        working-directory: logexplorer
        run: rustup toolchain install stable --profile minimal && rustup default stable && cargo build --release --locked -p logexplorer

      - name: The build to release
        if: inputs.linux-app != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.linux-app }}
          path: ${{ runner.temp }}/release

      # The portable tar.gz as users unpack it (an artifact's own zip would drop the execute bits)
      - name: Test that build
        if: inputs.linux-app != ''
        shell: bash
        run: |
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/release/FileSearchManager-*-linux-x64.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::the artifact ${{ inputs.linux-app }} holds ${#archives[@]} portable archives, not one"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/app"
          test -x "$RUNNER_TEMP/app/file-search-manager/FileSearchManager"
          echo "WIN_SEARCH_APP=$RUNNER_TEMP/app/file-search-manager/FileSearchManager" >> "$GITHUB_ENV"

      # A small file system of its own for the files the tests create: the app indexes only
      # that mount, so the load takes a moment instead of walking the whole runner image
      - name: Work file system
        run: |
          truncate -s 64M "$RUNNER_TEMP/smoke.img"
          mkfs.ext4 -q "$RUNNER_TEMP/smoke.img"
          sudo mkdir -p /mnt/smoke
          sudo mount -o loop "$RUNNER_TEMP/smoke.img" /mnt/smoke
          sudo chown "$(id -u):$(id -g)" /mnt/smoke

      - name: Smoke tests
        env:
          CI: 'true'
          WIN_SEARCH_SMOKE_WORK: /mnt/smoke
        run: xvfb-run -a -s "-screen 0 1600x1000x24" sh -c 'openbox & sleep 1; dotnet test search.smoke -c Release --logger "console;verbosity=normal" --logger trx --results-directory TestResults'

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-results-Linux
          path: TestResults/**
          if-no-files-found: error
