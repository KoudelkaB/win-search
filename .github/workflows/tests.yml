name: tests

# The headless tests (search.tests): the model, the index readers and the real main window
# on Avalonia's headless platform - no display, no input. On every pull request and push to
# main, on both systems; the release calls it before it publishes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tag history
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Headless tests
        run: dotnet test search.tests -c Release --logger "console;verbosity=normal"
