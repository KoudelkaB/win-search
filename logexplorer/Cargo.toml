[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = true
panic = "abort"

# Tests and debug runs still work on big files at a usable speed
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
