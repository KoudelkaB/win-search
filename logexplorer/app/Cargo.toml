[package]
name = "logexplorer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Log Explorer: a fast log viewer with a staged Filter/Replace/Sort/Diff pipeline"

[dependencies]
logexplorer-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
# The clipboard beyond text: the file list of Explorer (see clipboard.rs)
arboard = { version = "3", default-features = false }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
directories = "6"
rayon = "1"
sys-locale = "0.3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"

# GNOME/Wayland does not draw server-side decorations. Winit's fallback is a blank
# bar; Adwaita draws the title and window controls, including the loaded file name.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

# Files dropped into the program while it is elevated (elevated_drop.rs)
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The smoke tests on Windows: real keys, the clipboard and UI Automation
[target.'cfg(windows)'.dev-dependencies]
arboard = { version = "3", default-features = false }
uiautomation = "0.25"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
