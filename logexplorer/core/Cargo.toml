[package]
name = "logexplorer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Log Explorer engine: memory-shared text stages and the Filter/Replace/Sort/Diff/Extract/Unique/Join pipeline"

[dependencies]
aho-corasick = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
fancy-regex = "0.14"
hashbrown = "0.15"
memchr = "2"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
simdutf8 = "0.1"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
